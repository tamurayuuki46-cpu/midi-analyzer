<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f5" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="作曲素材を集め、曲を理解するためのAndroid-first MIDI Analyzer" />
    <title>MIDI Analyzer v0.12-dev</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">MIDI ANALYZER · v0.12-dev</p>
        <h1>素材を集める / 曲を理解する</h1>
        <p>MIDIはそのまま解析し、AudioやMoises等のStemは端末内で素材化・Audio→MIDIして分析へつなげます。</p>
      </header>
      <div id="audio-to-midi-root"></div>
      <div id="audio-note-tools-root"></div>
      <div id="stem-reference-root"></div>
      <section class="panel" aria-labelledby="import-title">
        <div class="panel-heading"><div><p class="eyebrow">MIDI / MATERIAL IMPORT</p><h2 id="import-title">MIDIを読み込む</h2></div></div>
        <form id="import-form" class="form-stack">
          <div class="field"><label for="midi-file">MIDIファイル</label><input id="midi-file" name="midi-file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" required /><small>.mid / .midi を読み取ります。</small></div>
          <div class="field"><label for="midi-origin">取り込み元</label><select id="midi-origin" name="midi-origin"><option value="midi">通常のMIDI</option><option value="ripx">RipXから書き出したMIDI</option><option value="basic-pitch">Audio→MIDI (Basic Pitch)</option></select><small>素材の出所を記録するために使い、Note自体は変更しません。</small></div>
          <label class="save-choice" for="save-midi"><input id="save-midi" name="save-midi" type="checkbox" /><span><strong>この端末に保存する</strong><small>初期値はOFFです。ONの場合だけ、元MIDIと正規化結果をIndexedDBへ保存します。</small></span></label>
          <button id="import-button" class="primary-button" type="submit">MIDIを読み込む</button>
        </form>
        <p class="helper-note">保存したMIDI・素材Clip・Stemはこの端末内だけで扱い、外部サービスへ自動送信しません。旧Recorder Takeも互換性のため保持します。</p>
        <p id="storage-status" class="storage-status" aria-live="polite"></p>
      </section>
      <div id="saved-midi-list"></div>
      <div id="result" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/ui/midiKeyTools.js"></script>
    <script type="module" src="/src/ui/basicPitchNoteTools.js"></script>
    <script type="module" src="/src/ui/audioToMidiEntry.js"></script>
    <script type="module" src="/src/ui/stemReferenceUi.js"></script>
  </body>
</html>
