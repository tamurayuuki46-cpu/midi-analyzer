name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'chatgpt/**'
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: SongProject ownership/data retention contract
        run: node --test test/songProjectOwnershipContract.test.js

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Basic Pitch local model assets
        run: |
          test -f dist/basic-pitch-model/model.json
          test -f dist/basic-pitch-model/group1-shard1of1.bin

      - name: Mobile Chromium regression
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8081 --directory dist > /tmp/analyzer-server.log 2>&1 &
          ANALYZER_URL=http://127.0.0.1:8081/ node scripts/browser-mobile.mjs

      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-mobile-evidence
          path: test-results/
