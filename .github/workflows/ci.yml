name: CI

on:
  push:
    branches:
      - develop
      - 'chatgpt/**'
      - 'claude/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
